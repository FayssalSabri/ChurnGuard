mlflow:
  tracking_uri: "http://localhost:5000"
  experiment_name: "customer-churn-prediction"
  registry_uri: "sqlite:///mlruns/mlflow.db"
  model_name: "churnguard-model"

data:
  train_path: "data/customer_churn_dataset-training-master.csv"
  test_path: "data/customer_churn_dataset-testing-master.csv"
  test_size: 0.2
  random_state: 42
  validation_split: 0.1

model:
  algorithms: ["random_forest", "gradient_boosting", "logistic_regression"]
  params:
    random_forest:
      n_estimators: [100, 200]
      max_depth: [10, 20, None]
      min_samples_split: [2, 5]
    gradient_boosting:
      n_estimators: [100, 200]
      learning_rate: [0.01, 0.1, 0.2]
      max_depth: [3, 5]
    logistic_regression:
      C: [0.1, 1, 10]
      penalty: ['l2']

training:
  cv_folds: 5
  scoring: "roc_auc"
  n_jobs: -1
  verbose: 1

api:
  host: "0.0.0.0"
  port: 8000
  model_stage: "Production"
  log_level: "info"

monitoring:
  drift_threshold: 0.05
  monitoring_interval: 3600
  performance_threshold: 0.7
  alert_email: "admin@example.com"

preprocessing:
  numeric_strategy: "median"
  categorical_strategy: "most_frequent"
  scale_numeric: true
  encode_categorical: true